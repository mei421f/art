<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>پنل مدیریت — Artosphere</title>
<link rel="icon" href="data:," />
<link rel="stylesheet" href="/assets/style.css" />
<style>
  body { background: var(--color-bg); }
  .admin-shell { max-width: 980px; margin: 0 auto; padding: 48px 24px 100px; }
  .admin-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 40px; }
  .admin-header h1 { font-size: 1.4rem; }
  .admin-logout { font-size: 13px; border-bottom: 1px solid currentColor; }
  .admin-tabs { display: flex; gap: 24px; border-bottom: 1px solid var(--color-line); margin-bottom: 32px; }
  .admin-tab { padding-bottom: 12px; font-size: 14px; color: var(--color-muted); border-bottom: 2px solid transparent; }
  .admin-tab.is-active { color: var(--color-ink); border-color: var(--color-ink); }
  .admin-panel { display: none; }
  .admin-panel.is-active { display: block; }

  .login-shell { max-width: 380px; margin: 15vh auto; padding: 0 24px; }
  .login-shell h1 { font-size: 1.6rem; margin-bottom: 28px; }
  .field { display: flex; flex-direction: column; gap: 8px; margin-bottom: 18px; }
  .field label { font-size: 13px; color: var(--color-muted); font-family: var(--font-mono); }
  .field input, .field textarea, .field select {
    background: transparent; border: 1px solid var(--color-line); padding: 10px 12px; font-size: 15px; border-radius: var(--radius);
  }
  .btn { display: inline-block; padding: 12px 24px; background: var(--color-ink); color: var(--color-inverse); font-size: 14px; border-radius: var(--radius); }
  .btn.secondary { background: transparent; color: var(--color-ink); border: 1px solid var(--color-line); }
  .btn.danger { background: #b3261e; color: #fff; }
  .error-text { color: #b3261e; font-size: 13px; min-height: 18px; }
  .ok-text { color: #2e7d32; font-size: 13px; min-height: 18px; }

  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: start; padding: 10px 8px; border-bottom: 1px solid var(--color-line); vertical-align: top; }
  th { color: var(--color-muted); font-weight: 400; font-family: var(--font-mono); font-size: 12px; }
  .row-actions { display: flex; gap: 10px; }
  .row-actions button { font-size: 13px; border-bottom: 1px solid currentColor; }
  .unread-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--color-accent); margin-inline-end: 6px; }

  .project-form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 24px; }
  .project-form-grid .field.full { grid-column: 1 / -1; }
  .new-project-toggle { margin-bottom: 20px; }
</style>
</head>
<body>

<!-- LOGIN -->
<div class="login-shell" id="loginShell">
  <h1>ورود به پنل مدیریت</h1>
  <form id="loginForm">
    <div class="field">
      <label for="username">نام کاربری</label>
      <input id="username" name="username" type="text" autocomplete="username" required />
    </div>
    <div class="field">
      <label for="password">رمز عبور</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required />
    </div>
    <p class="error-text" id="loginError"></p>
    <button class="btn" type="submit">ورود</button>
  </form>
</div>

<!-- ADMIN SHELL -->
<div class="admin-shell" id="adminShell" style="display:none;">
  <div class="admin-header">
    <h1>پنل مدیریت Artosphere</h1>
    <button class="admin-logout" id="logoutBtn">خروج</button>
  </div>

  <div class="admin-tabs">
    <button class="admin-tab is-active" data-tab="projects">پروژه‌ها</button>
    <button class="admin-tab" data-tab="messages">پیام‌ها</button>
  </div>

  <!-- PROJECTS -->
  <section class="admin-panel is-active" id="panel-projects">
    <div class="new-project-toggle">
      <button class="btn secondary" id="newProjectBtn">+ پروژه جدید</button>
    </div>

    <form id="projectForm" style="display:none; margin-bottom:40px; border:1px solid var(--color-line); padding:24px; border-radius: var(--radius);">
      <input type="hidden" id="pf-id" />
      <div class="project-form-grid">
        <div class="field"><label>slug (یکتا، انگلیسی)</label><input id="pf-slug" required /></div>
        <div class="field"><label>سال</label><input id="pf-year" /></div>
        <div class="field"><label>عنوان (فارسی)</label><input id="pf-title-fa" required /></div>
        <div class="field"><label>عنوان (انگلیسی)</label><input id="pf-title-en" required /></div>
        <div class="field"><label>دسته‌بندی (فارسی)</label><input id="pf-cat-fa" /></div>
        <div class="field"><label>دسته‌بندی (انگلیسی)</label><input id="pf-cat-en" /></div>
        <div class="field full"><label>خلاصه (فارسی)</label><input id="pf-summary-fa" /></div>
        <div class="field full"><label>خلاصه (انگلیسی)</label><input id="pf-summary-en" /></div>
        <div class="field full"><label>توضیح کامل (فارسی)</label><textarea id="pf-desc-fa" rows="3"></textarea></div>
        <div class="field full"><label>توضیح کامل (انگلیسی)</label><textarea id="pf-desc-en" rows="3"></textarea></div>
        <div class="field"><label>آدرس تصویر کاور</label><input id="pf-cover" placeholder="/assets/images/example.jpg" /></div>
        <div class="field"><label>ترتیب نمایش</label><input id="pf-order" type="number" value="0" /></div>
        <div class="field">
          <label>وضعیت انتشار</label>
          <select id="pf-published"><option value="true">منتشرشده</option><option value="false">پیش‌نویس</option></select>
        </div>
      </div>
      <p class="error-text" id="projectFormError"></p>
      <div class="row-actions">
        <button class="btn" type="submit">ذخیره</button>
        <button class="btn secondary" type="button" id="cancelProjectBtn">انصراف</button>
      </div>
    </form>

    <table>
      <thead><tr><th>عنوان</th><th>slug</th><th>وضعیت</th><th></th></tr></thead>
      <tbody id="projectsTableBody"></tbody>
    </table>
  </section>

  <!-- MESSAGES -->
  <section class="admin-panel" id="panel-messages">
    <table>
      <thead><tr><th>نام</th><th>ایمیل</th><th>پیام</th><th>تاریخ</th><th></th></tr></thead>
      <tbody id="messagesTableBody"></tbody>
    </table>
  </section>
</div>

<script src="/assets/admin.js" defer></script>
</body>
</html>
